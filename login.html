<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login / Signup UI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter, sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#eef2ff,#ffffff);
}

.container{
  width:380px;
  background:#fff;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  overflow:hidden;
}

.tabs{
  display:flex;
}

.tab{
  flex:1;
  text-align:center;
  padding:15px;
  cursor:pointer;
  font-weight:600;
  background:#f3f4f6;
}

.tab.active{
  background:#4f46e5;
  color:#fff;
}

.form{
  padding:25px;
  display:none;
}

.form.active{
  display:block;
}

h2{
  margin-bottom:15px;
  font-size:20px;
}

input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:10px;
  outline:none;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#4f46e5;
  color:#fff;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
}

button:hover{
  background:#4338ca;
}

.text{
  text-align:center;
  margin-top:10px;
  font-size:12px;
  color:#666;
}
</style>
</head>
<body>

<div class="container">

  <div class="tabs">
    <div class="tab active" onclick="showTab('login')">Login</div>
    <div class="tab" onclick="showTab('signup')">Signup</div>
  </div>

  <!-- Login Form -->
  <div class="form active" id="login">
    <h2>Welcome Back 👋</h2>
    <input type="email" placeholder="Email" />
    <input type="password" placeholder="Password" />
    <button>Login</button>
    <div class="text">Don't have an account? Switch to Signup</div>
  </div>

  <!-- Signup Form -->
  <div class="form" id="signup">
    <h2>Create Account 🚀</h2>
    <input type="text" placeholder="Full Name" />
    <input type="email" placeholder="Email" />
    <input type="password" placeholder="Password" />
    <button>Signup</button>
    <div class="text">Already have an account? Switch to Login</div>
  </div>

</div>

<script>
function showTab(tab){
  document.querySelectorAll('.form').forEach(f=>f.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));

  document.getElementById(tab).classList.add('active');
  event.target.classList.add('active');
}
</script>

</body>
</html>
